[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yoga-assist"
version = "2.0.0"
description = "AI-Powered Real-Time Yoga Pose Alignment & Biomechanics Validator"
authors = [{ name = "Ketan", email = "ketanpalankar123@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.35.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.22.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
ai = [
    "mediapipe>=0.10.0",
    "gTTS>=2.5.0",
]
dev = [
    "pytest>=8.0.0",
]
